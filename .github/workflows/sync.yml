name: Sync Container Images to ACR

on:
  push:
    branches:
      - master
  workflow_dispatch:
  #schedule:
  #  # 每天 UTC 01:17 自动同步一次，保证 latest 类镜像保持最新（可自行调整或删除）
  #  - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: sync-images
  cancel-in-progress: true

jobs:
  sync-images:
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.cn-beijing.aliyuncs.com
      # CONCURRENCY: 4   # 同时同步的镜像数量，可按需调整
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to ACR
        run: skopeo login "$REGISTRY" -u "${{ secrets.ACR_USERNAME }}" -p "${{ secrets.ACR_PASSWORD }}"

      - name: Sync Images
        run: bash sync.sh
