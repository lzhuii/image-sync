name: Sync Container Images to ACR

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: sync-images

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.cn-beijing.aliyuncs.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo shellcheck

      - name: shellcheck
        run: shellcheck -x sync.sh

      - name: Validate images.txt
        run: bash sync.sh validate

      - name: Login to ACR
        run: skopeo login "$REGISTRY" -u "${{ secrets.ACR_USERNAME }}" -p "${{ secrets.ACR_PASSWORD }}"

      - name: Login to Docker Hub (if configured)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Authenticating to Docker Hub (raises pull rate limit from 100 to 200 per 6h)"
            skopeo login docker.io -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
          else
            echo "Docker Hub credentials not configured, pulling anonymously (rate limit 100 per 6h per IP)"
          fi

      - name: Sync images
        run: bash sync.sh
