name: Sync Container Images to ACR

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: sync-images
  cancel-in-progress: true

jobs:
  sync-images:
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.cn-beijing.aliyuncs.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to ACR
        run: skopeo login "$REGISTRY" -u "${{ secrets.ACR_USERNAME }}" -p "${{ secrets.ACR_PASSWORD }}"

      - name: Sync Images
        run: bash sync.sh
