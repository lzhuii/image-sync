name: Lint

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        uses: rhysd/action-shellcheck@v1
        with:
          scversion: stable
          check_together: "yes"
